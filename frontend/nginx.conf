# Rendered by the nginx image's envsubst step: only ${DOMAIN} is substituted, so nginx's own
# $host and $uri survive. server_name stays a catch-all — the certificate names the domain,
# and a request by bare IP should still be answered rather than fall through to nothing.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt writes its challenge here and reads it back over plain HTTP. Kept above
    # the redirect so renewals keep working now that everything else moved to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # No OCSP stapling here on purpose: Let's Encrypt no longer publishes an OCSP responder
    # URL in its certificates, so nginx ignores the directive and only logs a warning — and
    # browsers have nothing to look up either, which is the outcome stapling was for.

    # Deliberately one day, not one year. HSTS is a promise the browser will not let us take
    # back: if renewal breaks, visitors are locked out for the whole max-age. Raise this to
    # 31536000 after the first automatic renewal has actually happened.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # The SPA owns its routes: anything that is not a real file is index.html, or a reload
    # on /register would be a 404 from nginx instead of a page from the router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset names never change contents, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The rate limiter counts by client address; without this every visitor would share
        # one bucket and a single attacker could lock out the whole platform.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/wasm text/plain;
    gzip_min_length 512;
    gzip_comp_level 6;
    # woff2 and webp are already compressed; running gzip over them burns CPU for nothing.

    client_max_body_size 16m;
}
