server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Let's Encrypt writes its challenge here and reads it back over plain HTTP. Kept
    # above the redirect so renewals keep working once everything else moves to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # The SPA owns its routes: anything that is not a real file is index.html, or a reload
    # on /register would be a 404 from nginx instead of a page from the router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset names never change contents, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The rate limiter counts by client address; without this every visitor would share
        # one bucket and a single attacker could lock out the whole platform.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 16m;
}
