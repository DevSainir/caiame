# Автоматический выкат: то же самое, что выкатывающий делает руками, только по зелёному CI.
#
# Пока секретов нет, выкат пропускается и пишет в запуск, чего не хватает. Не падает:
# красное на каждом коммите учит не смотреть на красное. И не делает вид, что выкатил.
#
# Что нужно завести в Settings → Secrets and variables → Actions:
#   DEPLOY_HOST        — адрес сервера
#   DEPLOY_USER        — пользователь, из-под которого идёт выкат
#   DEPLOY_SSH_KEY     — приватный ключ этого пользователя, целиком, включая строки BEGIN/END
#   DEPLOY_KNOWN_HOSTS — вывод `ssh-keyscan <адрес>`: без него первое соединение доверяет
#                        кому угодно, а это ровно та дверь, ради которой в выкат и лезут
name: Выкат

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  # Ручной запуск на случай, когда выкатить нужно без нового коммита.
  workflow_dispatch:

concurrency:
  # Два выката одновременно перетирают друг друга на середине rsync.
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Отдельным шагом, чтобы ненастроенный выкат пропускался, а не краснел. Красный запуск на
  # каждом коммите учит не смотреть на красное — и настоящую поломку потом не заметят.
  ready:
    name: Проверить, что ключи заведены
    runs-on: ubuntu-latest
    # Красный CI до сервера не доезжает; ручной запуск проверяет только себя.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$USER" ] || missing="$missing DEPLOY_USER"
          [ -n "$KEY" ] || missing="$missing DEPLOY_SSH_KEY"
          [ -n "$KNOWN_HOSTS" ] || missing="$missing DEPLOY_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Выкат не настроен: нет секретов$missing. Как их завести — docs/deploy.md, раздел «Автоматический выкат»."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Выкатить на сервер
    runs-on: ubuntu-latest
    needs: ready
    if: needs.ready.outputs.configured == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Подготовить ключ
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Едет содержимое коммита, а не рабочая копия: git archive не знает про то, чего в
      # коммите нет, и на сервер не уезжает ничего лишнего.
      - name: Собрать архив и увезти на сервер
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          git archive HEAD -o /tmp/caiame-deploy.tar
          scp -i ~/.ssh/id_deploy /tmp/caiame-deploy.tar "$USER@$HOST:/tmp/"

      # Порядок шагов тот же, что и в ручном выкате, и по той же причине: миграция до
      # сборки накатывается из старого образа и выглядит успешной.
      - name: Разложить, собрать, накатить миграции, поднять
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" 'set -e
            rm -rf /tmp/caiame-new && mkdir -p /tmp/caiame-new
            tar -xf /tmp/caiame-deploy.tar -C /tmp/caiame-new
            rsync -a --delete \
              --exclude ".env" --exclude ".env.bak-*" \
              --exclude "acme-webroot/" --exclude "backup-age.key" \
              /tmp/caiame-new/ /opt/caiame/
            rm -rf /tmp/caiame-new /tmp/caiame-deploy.tar
            cd /opt/caiame
            docker compose -f docker-compose.prod.yml build api web
            docker compose -f docker-compose.prod.yml run --rm api alembic upgrade head
            docker compose -f docker-compose.prod.yml up -d
          '

      # Выкат считается состоявшимся не по коду возврата ssh, а по ответу сайта: контейнер
      # может подняться и не работать.
      - name: Убедиться, что сайт отвечает
        run: |
          for _ in $(seq 30); do
            ready=$(curl -s https://caiame.org/api/v1/health/ready || true)
            case "$ready" in *'"status":"ok"'*) echo "$ready"; exit 0;; esac
            sleep 2
          done
          echo "Сайт не ответил готовностью за минуту после выката."
          exit 1
