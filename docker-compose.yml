# Development stack only. The credentials below are local defaults and must not be reused
# in a deployment: production gets its own compose file and its secrets from the environment.
#
# Host ports are shifted: 5432 and 8000 are often taken by unrelated projects.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: caiame
      POSTGRES_PASSWORD: caiame
      POSTGRES_DB: caiame
    ports:
      - "5433:5432"
    volumes:
      - caiame-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caiame"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage for lecture material, so an upload can be exercised end to end without
  # an account anywhere. Production points the same settings at R2.
  storage:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9101"]
    environment:
      MINIO_ROOT_USER: caiame
      MINIO_ROOT_PASSWORD: caiame-dev-secret
      # The upload goes straight from the page to storage, so storage has to answer the
      # page's origin. Set at startup rather than through the admin API, which needs a
      # restart to take effect.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9100:9000"
      - "9101:9101"
    volumes:
      - caiame-media:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the two buckets and opens the public one for reading, then exits. A bucket that
  # has to be made by hand is a bucket that is missing on somebody's machine.
  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 caiame caiame-dev-secret &&
      mc mb --ignore-existing local/caiame-private local/caiame-public &&
      mc anonymous set download local/caiame-public
      "

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://caiame:caiame@db:5432/caiame
      CORS_ORIGINS: '["http://localhost:5173"]'
      REDIS_URL: redis://redis:6379/0
      # The browser uploads straight to storage, so this address has to be the one the
      # browser can reach, not the one inside the compose network.
      MEDIA_S3_ENDPOINT: http://localhost:9100
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  caiame-pgdata:
  caiame-media:
