# Production stack. Secrets come from the .env file next to this one, which is never
# committed; the placeholders below fail loudly rather than defaulting to something weak.
#
# Only the web container publishes a port. Postgres and Redis stay on the internal network:
# a database reachable from the internet is a database someone else will find.
name: caiame

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: caiame
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: caiame
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caiame"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://caiame:${POSTGRES_PASSWORD}@db:5432/caiame
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      # Хранилище материалов. Ссылки на загрузку подписывает приложение, а сам файл идёт
      # из браузера прямо в хранилище — эти значения должны указывать на адрес, доступный
      # из браузера, а не только изнутри сети.
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:?MEDIA_S3_ENDPOINT is required}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-auto}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:?MEDIA_S3_ACCESS_KEY is required}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:?MEDIA_S3_SECRET_KEY is required}
      MEDIA_BUCKET_PRIVATE: ${MEDIA_BUCKET_PRIVATE:-caiame-private}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      # Only used to find the certificate directory; the server blocks answer any host.
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Certificates and ACME challenges live on the host: certbot renews them there, and
      # the container only ever reads them.
      - ./acme-webroot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
