[project]
name = "caiame-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "redis>=5.2",
    # The application talks to object storage over plain HTTP: it signs the requests
    # itself, so this is the whole storage client.
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "ASYNC", "S", "RUF", "SIM", "RET", "PT", "PTH"]
# B008: FastAPI intentionally calls Depends()/Query() in argument defaults.
# S101: asserts are the assertion mechanism in tests.
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
# RUF001 warns about letters that look Latin but are not — the rule that keeps a Cyrillic
# `с` out of an identifier. A transliteration table is a page of exactly those letters and
# cannot be written without them, so the rule is off for that one file and nowhere else.
"src/core/text.py" = ["RUF001"]
# A fixture without a literal password is not a fixture. Scoped to tests on purpose:
# the same rules stay on for src/ and scripts/, where a literal password is a finding.
"tests/**" = ["S105", "S106", "S107"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_any_generics = true
warn_redundant_casts = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "--strict-config", "--durations=10"]
markers = [
    "unit: pure logic, no I/O",
    "component: the app with fake repositories",
    "integration: a real database",
]
